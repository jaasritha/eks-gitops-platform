################################################################################
# ArgoCD App-of-Apps — Root Application
#
# Bootstrap this ONCE manually after cluster creation:
#   kubectl apply -f argocd/app-of-apps.yaml
#
# Everything else (platform addons, monitoring, apps) is managed by ArgoCD.
################################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-gitops-platform   # replace
    targetRevision: HEAD
    path: clusters/$ENV_NAME/argocd-apps                        # replace $ENV_NAME at bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
