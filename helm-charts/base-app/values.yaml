################################################################################
# base-app Helm chart — default values
# Override in apps/{app}/helm-values/values-{env}.yaml
################################################################################

global:
  env: dev
  app: my-app

# Image config
image:
  repository: ""             # e.g. 123456789.dkr.ecr.ap-southeast-1.amazonaws.com/my-app
  tag: "latest"
  pullPolicy: IfNotPresent

# Replica count (override per env)
replicaCount: 1

# Resource requests/limits (override per env)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# HPA config
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ServiceAccount with IRSA annotation
serviceAccount:
  create: true
  name: ""                   # defaults to app name
  annotations: {}            # add eks.amazonaws.com/role-arn here

# Service
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  protocol: TCP

# Ingress (AWS ALB)
ingress:
  enabled: false
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ""               # set per-environment
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Environment variables
env: []
# - name: DATABASE_URL
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: DATABASE_URL

# ConfigMap data (mounted as env or files)
configMap:
  enabled: false
  data: {}

# Liveness and Readiness probes
probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# Pod annotations (e.g. Prometheus scraping)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Node selection
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - "{{ .Release.Name }}"
          topologyKey: kubernetes.io/hostname

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Topology spread (multi-AZ)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "{{ .Release.Name }}"
