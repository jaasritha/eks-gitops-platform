################################################################################
# helm-charts/monitoring — dev values
# Umbrella chart wrapping kube-prometheus-stack + Loki
################################################################################

kube-prometheus-stack:
  nameOverride: prometheus
  fullnameOverride: prometheus

  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: "5GB"
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      # Scrape all pods with prometheus annotations
      additionalScrapeConfigs:
        - job_name: 'kubernetes-pods'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)

  grafana:
    enabled: true
    adminPassword: "changeme-dev"    # use Secrets Manager in prod
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
      hosts:
        - grafana.dev.example.com    # replace
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: Platform
            type: file
            disableDeletion: false
            options:
              path: /var/lib/grafana/dashboards/default
    dashboardsConfigMaps:
      default: grafana-dashboards   # k8s ConfigMap with dashboard JSON

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi

  # Disable unused components in dev
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false

loki-stack:
  loki:
    enabled: true
    persistence:
      enabled: true
      storageClassName: gp3
      size: 10Gi
    config:
      limits_config:
        retention_period: 168h     # 7 days in dev

  promtail:
    enabled: true
    config:
      clients:
        - url: http://prometheus-loki:3100/loki/api/v1/push
