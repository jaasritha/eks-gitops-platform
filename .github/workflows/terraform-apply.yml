################################################################################
# GitHub Actions — Terraform Apply on merge to main
################################################################################
name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "ap-southeast-1"

jobs:
  apply:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
      max-parallel: 1     # apply envs sequentially: dev → staging → prod
    environment: ${{ matrix.env }}-apply

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform-${{ matrix.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform apply -auto-approve -input=false
