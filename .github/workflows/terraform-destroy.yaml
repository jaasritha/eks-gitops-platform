################################################################################
# GitHub Actions — Destroy EKS Platform
#
# Triggered manually (workflow_dispatch) — destroys everything in correct order.
# WARNING: This is irreversible. All data will be lost.
#
# Usage:
#   GitHub UI → Actions → Destroy EKS Platform → Run workflow → select env
################################################################################
name: Destroy EKS Platform

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to destroy (dev / staging / prod)"
                required: true
                default: "dev"
                type: choice
                options:
                    - dev
                    - staging
                    - prod
            confirm:
                description: "Type DESTROY to confirm — this is irreversible"
                required: true
                default: ""
            delete_state_bucket:
                description: "Also delete S3 state bucket and DynamoDB lock table?"
                required: true
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: ap-southeast-1
    CLUSTER_NAME: eks-gitops-${{ github.event.inputs.environment }}

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Validate confirmation input
              run: |
                  if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
                    echo "ERROR: You must type DESTROY in the confirm field"
                    echo "You typed: ${{ github.event.inputs.confirm }}"
                    exit 1
                  fi
                  echo "Confirmation validated — proceeding with destruction of eks-gitops-${{ github.event.inputs.environment }}"

    destroy:
        needs: validate
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}-apply

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Install kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: latest

            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                  version: latest

            - name: Install Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.7.5"

            - name: Update kubeconfig
              run: |
                  aws eks update-kubeconfig \
                    --name ${{ env.CLUSTER_NAME }} \
                    --region ${{ env.AWS_REGION }}
              continue-on-error: true

            - name: Step 1 — Delete all ArgoCD Applications
              run: |
                  echo "==> Deleting ArgoCD Applications..."
                  kubectl delete applications --all -n argocd \
                    --timeout=300s 2>/dev/null || true
                  echo "Waiting 60s for ALB controller + external-dns to clean up AWS resources..."
                  sleep 60
                  echo "==> Checking for remaining ALBs..."
                  aws elbv2 describe-load-balancers \
                    --query "LoadBalancers[?contains(LoadBalancerName, 'k8s')].[LoadBalancerName,State.Code]" \
                    --output table 2>/dev/null || true
              continue-on-error: true

            - name: Step 2 — Clean up orphaned ALBs
              run: |
                  echo "==> Checking for orphaned ALBs tagged with cluster..."
                  ALB_ARNS=$(aws elbv2 describe-load-balancers \
                    --query "LoadBalancers[*].LoadBalancerArn" \
                    --output text 2>/dev/null || echo "")
                  for ARN in $ALB_ARNS; do
                    TAGS=$(aws elbv2 describe-tags \
                      --resource-arns $ARN \
                      --query "TagDescriptions[0].Tags[?Key=='kubernetes.io/cluster/${{ env.CLUSTER_NAME }}'].Value" \
                      --output text 2>/dev/null || echo "")
                    if [ -n "$TAGS" ]; then
                      echo "Deleting orphaned ALB: $ARN"
                      aws elbv2 delete-load-balancer --load-balancer-arn $ARN || true
                    fi
                  done
                  sleep 30
              continue-on-error: true

            - name: Step 3 — Uninstall ArgoCD
              run: |
                  echo "==> Uninstalling ArgoCD..."
                  helm uninstall argocd -n argocd --timeout 5m 2>/dev/null || true
                  kubectl delete namespace argocd --timeout=120s 2>/dev/null || true
                  echo "ArgoCD removed"
              continue-on-error: true

            - name: Step 4 — Remove EKS access entries
              run: |
                  echo "==> Removing EKS access entries..."
                  ENTRIES=$(aws eks list-access-entries \
                    --cluster-name ${{ env.CLUSTER_NAME }} \
                    --query "accessEntries[]" \
                    --output text 2>/dev/null || echo "")
                  for ENTRY in $ENTRIES; do
                    echo "Removing: $ENTRY"
                    aws eks delete-access-entry \
                      --cluster-name ${{ env.CLUSTER_NAME }} \
                      --principal-arn "$ENTRY" 2>/dev/null || true
                  done
              continue-on-error: true

            - name: Step 5 — Terraform init
              working-directory: terraform/envs/${{ github.event.inputs.environment }}
              run: terraform init -input=false

            - name: Step 5a — Terraform destroy first pass
              working-directory: terraform/envs/${{ github.event.inputs.environment }}
              run: terraform destroy -auto-approve -input=false
              continue-on-error: true

            - name: Step 5b — Terraform destroy retry
              working-directory: terraform/envs/${{ github.event.inputs.environment }}
              run: terraform destroy -auto-approve -input=false
              continue-on-error: true

            - name: Step 6 — Delete orphaned security groups
              run: |
                  echo "==> Looking for orphaned security groups..."
                  SG_IDS=$(aws ec2 describe-security-groups \
                    --filters "Name=tag-key,Values=kubernetes.io/cluster/${{ env.CLUSTER_NAME }}" \
                    --query "SecurityGroups[*].GroupId" \
                    --output text 2>/dev/null || echo "")
                  for SG_ID in $SG_IDS; do
                    echo "Deleting SG: $SG_ID"
                    aws ec2 delete-security-group --group-id $SG_ID 2>/dev/null || true
                  done
              continue-on-error: true

            - name: Step 7 — Delete state backend (optional)
              if: github.event.inputs.delete_state_bucket == 'true'
              run: |
                  BUCKET="eks-gitops-tfstate-${{ github.event.inputs.environment }}"
                  LOCK_TABLE="eks-gitops-tfstate-lock"
                  echo "==> Emptying and deleting S3 bucket: $BUCKET"
                  VERSIONS=$(aws s3api list-object-versions \
                    --bucket $BUCKET \
                    --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
                    --output json 2>/dev/null)
                  if [ "$VERSIONS" != "null" ] && [ -n "$VERSIONS" ]; then
                    aws s3api delete-objects --bucket $BUCKET --delete "$VERSIONS" 2>/dev/null || true
                  fi
                  MARKERS=$(aws s3api list-object-versions \
                    --bucket $BUCKET \
                    --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
                    --output json 2>/dev/null)
                  if [ "$MARKERS" != "null" ] && [ -n "$MARKERS" ]; then
                    aws s3api delete-objects --bucket $BUCKET --delete "$MARKERS" 2>/dev/null || true
                  fi
                  aws s3 rb s3://$BUCKET --force 2>/dev/null || true
                  echo "Deleted: $BUCKET"
                  echo "==> Deleting DynamoDB table: $LOCK_TABLE"
                  aws dynamodb delete-table \
                    --table-name $LOCK_TABLE \
                    --region ${{ env.AWS_REGION }} 2>/dev/null || true
                  echo "Deleted: $LOCK_TABLE"
              continue-on-error: true

            - name: Step 8 — Verify destruction
              run: |
                  echo "================================================="
                  echo " Destruction complete — final check"
                  echo "================================================="
                  echo "EKS clusters remaining:"
                  aws eks list-clusters \
                    --query "clusters[?contains(@,'eks-gitops')]" \
                    --output text 2>/dev/null || echo "none"
                  echo "VPCs remaining:"
                  aws ec2 describe-vpcs \
                    --filters "Name=tag:Project,Values=eks-gitops-platform" \
                    --query "Vpcs[*].VpcId" \
                    --output text 2>/dev/null || echo "none"
                  echo "ALBs remaining:"
                  aws elbv2 describe-load-balancers \
                    --query "LoadBalancers[?contains(LoadBalancerName,'k8s')].LoadBalancerName" \
                    --output text 2>/dev/null || echo "none"
                  echo "NAT Gateways remaining:"
                  aws ec2 describe-nat-gateways \
                    --filter "Name=tag:Project,Values=eks-gitops-platform" \
                             "Name=state,Values=available" \
                    --query "NatGateways[*].NatGatewayId" \
                    --output text 2>/dev/null || echo "none"
                  echo "================================================="
                  echo " Check AWS Cost Explorer in 24h to confirm zero spend."
                  echo " Note: KMS key has 7-day deletion window — billed until then."
                  echo "================================================="
