################################################################################
# GitHub Actions — Terraform Plan on Pull Request
################################################################################
name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
    branches:
      - main

permissions:
  id-token: write      # OIDC token for AWS auth
  contents: read
  pull-requests: write # post plan as PR comment

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "ap-southeast-1"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          # Detect which env directories changed
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^terraform/envs/' | cut -d'/' -f3 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "envs=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Changed environments: ${CHANGED}"

  plan:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(needs.detect-changes.outputs.envs) }}
    environment: ${{ matrix.env }}-plan

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform-${{ matrix.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/envs/${{ matrix.env }}
        run: |
          terraform plan -input=false -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/envs/${{ matrix.env }}/plan.txt', 'utf8');
            const body = `## Terraform Plan — \`${{ matrix.env }}\`
            \`\`\`hcl
            ${plan.slice(0, 65000)}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: terraform/envs/${{ matrix.env }}/tfplan
          retention-days: 5
